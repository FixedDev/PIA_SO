version: '3.8'

services:
  # HAProxy (Load Balancer)
  lb:
    image: haproxy:alpine
    ports:
      - "1129:1129"    
      - "8404:8404"   
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      - api
    networks:
      - app-network
  db:
    image: mysql:8.0
    container_name: mysql_db
    restart: always
    environment:
      MYSQL_DATABASE: 'escuela_db'
      MYSQL_USER: 'test'
      MYSQL_PASSWORD: 'password'
      MYSQL_ROOT_PASSWORD: 'root_password'
    ports:
      - "3306:3306" 
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app-network
  
  # Backend (Spring Boot)
  api:
    build: ./backend
    expose:
      - "1129"         
    deploy:
      replicas: 3
    restart: on-failure
    networks:
      - app-network
    environment:
      - SERVER_PORT=1129
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/escuela_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=test
      - SPRING_DATASOURCE_PASSWORD=password
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=com.mysql.cj.jdbc.Driver
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - SPRING_JPA_DATABASE_PLATFORM=org.hibernate.dialect.MySQL8Dialect
  web:
    build: 
      context: ./frontend
      args:
        NEXT_PUBLIC_BACKEND_URL: "http://localhost:1129"
    ports:
      - "3000:3000"
    depends_on:
      - lb
    networks:
      - app-network
volumes:
  mysql_data:
networks:
  app-network:
    driver: bridge
